<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Streaming de Parceiros | Zindub</title>

    <link rel="stylesheet" href="css/style.css" />

    <link rel="shortcut icon" href="https://images-ext-1.discordapp.net/external/05RobE2qnFmwWWe283iNCsDVLzo1xZspKxpcgvc5zAY/https/i.imgur.com/XWlaPplh.jpg?format=webp&width=930&height=930" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&family=Monoton&display=swap" rel="stylesheet">

    <script src="https://kit.fontawesome.com/c8e4d183c2.js" crossorigin="anonymous"></script>

    <style>
        /* Estilos para integrar a Galeria na Estrutura Zindub */
        .partner-wrapper {
            padding: 120px 10% 60px 10%; /* Espaço para não cobrir com a Nav */
            min-height: 80vh;
        }

        .category-header {
            border-left: 5px solid #C63C51;
            padding-left: 15px;
            margin-bottom: 30px;
        }

        .category-header h2 {
            color: #f3f3f3;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .partner-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .p-card {
            background-color: #0b161d;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
            position: relative;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .p-card:hover {
            transform: translateY(-10px);
            border-color: #C63C51;
        }

        .p-img {
            width: 100%;
            height: 150px;
            position: relative;
        }

        .p-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .p-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 13, 18, 0.75);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; transition: 0.3s;
        }

        .p-card:hover .p-overlay { opacity: 1; }

        .p-overlay i {
            color: #f3f3f3;
            font-size: 2rem;
            background: #C63C51;
            width: 50px; height: 50px;
            display: flex; justify-content: center; align-items: center;
            border-radius: 50%;
        }

        .p-text {
            padding: 15px;
        }

        .p-text span {
            color: #C63C51;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .p-text h3 {
            color: #f3f3f3;
            font-size: 1rem;
            margin: 5px 0;
        }

        @media(max-width:720px){
            .partner-wrapper { padding: 100px 5% 40px 5%; }
        }
    </style>
</head>

<body>

    <div id="progress">
        <span id="progress-value"></span>
    </div>

    <nav class="navigation">
        <input type="checkbox" class="menu-btn" id="menu-btn">
        <label for="menu-btn" class="menu-icon">
            <span class="nav-icon"></span>
        </label>

        <a href="index.html" class="logo">
            Zindub<span>Fandub</span>
        </a>

        <ul class="menu">
            <li><a href="index.html">Início</a></li>
            <li><a href="filmes.html">Filmes</a></li>
            <li><a href="series.html">Séries</a></li>
            <li><a href="videoscurtos.html">Videos curtos</a></li>
            <li><a href="ao-vivo.html">Zindub TV</a></li>
            <li><a href="contato.html">Sobre e Contato</a></li>
            <li><a href="anuncio.html">Anúncios</a></li>
            <li><a href="parceiros.html">Projetos Parceiros</a></li>
        </ul>
    </nav>

    <main class="partner-wrapper">
        
        <div class="category-header">
            <h2>Projetos <span>Parceiros</span></h2>
        </div>

        <section class="partner-grid">

            <div class="p-card">
                <a href="voicestudio.html">
                    <div class="p-img">
                        <img src="Imagens/voicestudio.png" alt="voicestudio.html">
                        <div class="p-overlay">
                            <i class="fas fa-play"></i>
                        </div>
                    </div>
                </a>
                <div class="p-text">
                    <span>Fandub / Edição</span>
                    <h3>Voice Studio</h3>
                </div>
            </div>


            </section>

    </main>

    <footer>
        <a href="index.html" class="logo">
            Zindub<span>Fandub</span>
        </a>
        <span class="copyright">
            Desde 2021 - Todos os direitos reservados aos donos das obras. Sem fins lucrativos.
        </span>
    </footer>

    <script src="js/jQuery.js"></script>

    <script>
        /* Mantendo seu script original de scroll */
        let scrollPrecentage = () => {
            let scrollProgress = document.getElementById("progress");
            let pos = document.documentElement.scrollTop;
            let calcHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            let scrollValue = Math.round(pos * 100 / calcHeight);
            scrollProgress.style.background = `conic-gradient(#C63C51 ${scrollValue}%, #2b2f38 ${scrollValue}%)`;
        }
        window.onscroll = scrollPrecentage;
        window.onload = scrollPrecentage;

        /* Menu fixo ao dar scroll */
        $(window).scroll(function(){
            if($(document).scrollTop() > 20){
                $('.navigation').addClass('fix-icon');
            }
            else{
                $('.navigation').removeClass('fix-icon');
            }
        });
    </script>

</body>
</html>
