<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel do Mestre | Zindub</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        body { background: #0b161d; color: #f3f3f3; font-family: 'Poppins', sans-serif; padding: 20px; }
        .painel { max-width: 700px; margin: 0 auto; background: #16242e; padding: 20px; border-radius: 15px; border: 1px solid #C63C51; }
        .historico-topo { background: #000; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #C63C51; max-height: 300px; overflow-y: auto; }
        select, textarea, input { width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; border: none; background: #1b2e3a; color: white; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        button { background: #C63C51; color: white; padding: 12px; border: none; width: 100%; cursor: pointer; border-radius: 5px; font-weight: bold; margin-top: 10px; transition: 0.3s; font-family: 'Poppins', sans-serif; }
        button:disabled { background: #5a202a; cursor: not-allowed; }
        .bloco { display: none; }
        .item-historico { border-bottom: 1px solid #444; padding: 10px 0; font-size: 13px; }
        
        /* Estilo da notificação de sucesso */
        .notificacao { display: none; background: #25d366; color: white; padding: 12px; text-align: center; border-radius: 5px; margin-top: 15px; font-weight: bold; font-size: 14px; }

        /* Estilos do Card de Visitas */
        .admin-stat-card { background-color: #040D12; border-left: 4px solid #C63C51; border-radius: 8px; padding: 20px; margin-top: 30px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); }
        .stat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .stat-header h3 { margin: 0; font-size: 14px; font-weight: 400; color: #a0a0a0; }
        .stat-body { display: flex; justify-content: space-between; align-items: flex-end; }
        .stat-number { font-size: 28px; font-weight: 600; color: #f3f3f3; }
        .btn-edit-stat { background-color: transparent; color: #C63C51; border: 1px solid #C63C51; border-radius: 4px; padding: 5px 12px; font-size: 12px; cursor: pointer; transition: all 0.3s ease; width: auto; margin: 0; }
        .btn-edit-stat:hover { background-color: #C63C51; color: #f3f3f3; }

        /* Estilos do Card do Bot */
        .bot-card { background-color: #040D12; border-left: 4px solid #25d366; border-radius: 8px; padding: 15px; margin-top: 15px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); display: flex; align-items: center; gap: 15px; }
        .bot-avatar-container { position: relative; width: 50px; height: 50px; flex-shrink: 0; }
        .bot-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #1b2e3a; border: 2px solid #1b2e3a; }
        .bot-status-dot { position: absolute; bottom: 0px; right: 0px; width: 12px; height: 12px; background-color: #25d366; border-radius: 50%; border: 2px solid #040D12; animation: pulse-green 1.5s infinite; }
        
        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(37, 211, 102, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
        }

        .bot-info { flex: 1; }
        .bot-name { margin: 0 0 4px 0; font-size: 15px; font-weight: 600; color: #f3f3f3; display: flex; align-items: center; gap: 8px; }
        .bot-tag { font-size: 10px; background: rgba(37, 211, 102, 0.15); color: #25d366; padding: 2px 6px; border-radius: 4px; font-weight: bold; letter-spacing: 0.5px; }
        .bot-desc { margin: 0; font-size: 12px; color: #a0a0a0; line-height: 1.4; }
    </style>
</head>
<body>

<div class="painel">
    <div class="historico-topo">
        <h3>Histórico Detalhado</h3>
        <div id="listaPedidos">Carregando...</div>
    </div>

    <label>Selecione a Página:</label>
    <select id="seletor" onchange="ajustarMenu()">
        <option value="">-- Selecione --</option>
        <optgroup label="Páginas 1 a 20">
            <script>for(let i=1; i<=20; i++) document.write(`<option value="pagina${i}">Página ${i}</option>`);</script>
        </optgroup>
        <optgroup label="Projetos">
            <option value="Shaman">Shaman</option>
            <option value="Angels of Death">Angels of Death</option>
            <option value="voicestudio">Voice Studio</option>
            <option value="herodub">HeroDub</option>
            <option value="aion">Aion</option>
        </optgroup>
    </select>

    <div id="areaAdmin" style="display:none;">
        <div id="grupoAnuncio" class="bloco">
            <textarea id="textoAnuncio" placeholder="Texto do anúncio..."></textarea>
            <input type="text" id="linkAnuncio" placeholder="Link do anúncio">
        </div>

        <div id="grupoComum" class="bloco">
            <input type="text" id="tituloObra" placeholder="Título da Obra">
            <textarea id="imagemObra" placeholder="Link da imagem..."></textarea>
            <textarea id="textoObra" placeholder="Textos (título, descrição e creditos)"></textarea>
            <input type="text" id="linkTrailer" placeholder="Link do Trailer">
            <input type="text" id="linkVideo" placeholder="Link do Vídeo">
            <input type="text" id="filme/serie" placeholder="Tipo: Filme/Série?">
            <input type="text" id="minutosObra" placeholder="Minutos e título do episódio (ex: 24min - Episódio 1: O livro)">
        </div>
        
        <div id="grupoComentarios" class="bloco">
            <input type="text" id="idComentario" placeholder="Comentário exato igual no site pelo usuário">
            <select id="acaoComentario">
                <option value="nenhuma">-- Ação --</option>
                <option value="apagar">Apagar Comentário</option>
            </select>
        </div>

        <button id="btnEnviar" onclick="salvarAprovacao()">Confirmar Alteração</button>
        
        <!-- Mensagem de Sucesso -->
        <div id="mensagemSucesso" class="notificacao">✅ Alteração enviada com sucesso!</div>
    </div>

    <!-- Card de Visitas -->
    <div class="admin-stat-card">
        <div class="stat-header">
            <h3>Total de Visitas no Site</h3>
        </div>
        <div class="stat-body">
            <span class="stat-number" id="visitorCount">...</span>
            <button class="btn-edit-stat" onclick="editarVisitas()">Acessar</button>
        </div>
    </div>

    <!-- Card do Bot Operando -->
    <div class="bot-card">
        <div class="bot-avatar-container">
            <img src="https://cdn-icons-png.flaticon.com/512/4712/4712010.png" alt="Avatar do Bot" class="bot-avatar">
            <span class="bot-status-dot"></span>
        </div>
        <div class="bot-info">
            <h4 class="bot-name">Zindub System Bot <span class="bot-tag">ONLINE</span></h4>
            <p class="bot-desc">Operando e monitorando o servidor 24 horas por dia. Sistema estável e processando dados em até 24h.</p>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

    const db = getFirestore(initializeApp({
        apiKey: "AIzaSyBPaNeovud2uYjIcNEdLkNsSl4YMjKp_Xw",
        authDomain: "zindub-e2ff7.firebaseapp.com",
        projectId: "zindub-e2ff7",
        storageBucket: "zindub-e2ff7.firebasestorage.app",
        messagingSenderId: "169563902252",
        appId: "1:169563902252:web:5c7e2c215189c6b1e61c89"
    }));

    const auth = getAuth();
    const MEU_EMAIL = "victoreman340@gmail.com"; 

    const visitasRef = doc(db, "estatisticas", "visitas");

    window.ajustarMenu = () => {
        const id = document.getElementById("seletor").value;
        document.getElementById("areaAdmin").style.display = id ? "block" : "none";
        document.getElementById("grupoAnuncio").style.display = (id === "pagina20") ? "block" : "none";
        document.getElementById("grupoComum").style.display = (id !== "pagina20" && id !== "") ? "block" : "none";
        document.getElementById("grupoComentarios").style.display = (id !== "pagina20" && id !== "") ? "block" : "none";
    };

    window.salvarAprovacao = async () => {
        const btnEnviar = document.getElementById("btnEnviar");
        btnEnviar.disabled = true;
        btnEnviar.innerText = "Enviando...";

        const id = document.getElementById("seletor").value;
        const dados = {
            pagina: id,
            titulo: document.getElementById("tituloObra").value || document.getElementById("textoAnuncio").value || "Sem título",
            texto: document.getElementById("textoObra").value || "N/A",
            trailer: document.getElementById("linkTrailer").value || "N/A",
            video: document.getElementById("linkVideo").value || document.getElementById("linkAnuncio").value || "N/A",
            minutos: document.getElementById("minutosObra").value || "N/A",
            acao: document.getElementById("acaoComentario").value,
            idCom: document.getElementById("idComentario").value || "N/A",
            verificado: false, // Fica falso por padrão; alteração de verificação agora é feita diretamente no painel do Firebase por segurança com múltiplos admins.
            data: new Date().toLocaleString()
        };

        try {
            await addDoc(collection(db, "historico_pedidos"), dados);
            carregarHistorico();

            const msgSucesso = document.getElementById("mensagemSucesso");
            msgSucesso.style.display = "block";

            document.querySelectorAll("#areaAdmin input[type='text'], #areaAdmin textarea").forEach(campo => campo.value = "");
            document.getElementById("acaoComentario").value = "nenhuma";

            setTimeout(() => {
                msgSucesso.style.display = "none";
                btnEnviar.disabled = false;
                btnEnviar.innerText = "Confirmar Alteração";
            }, 3000);

        } catch (erro) {
            console.error("Erro ao salvar:", erro);
            alert("Ocorreu um erro ao enviar. Tente novamente.");
            btnEnviar.disabled = false;
            btnEnviar.innerText = "Confirmar Alteração";
        }
    };

    window.editarVisitas = async () => {
        if (auth.currentUser && auth.currentUser.email === MEU_EMAIL) {
            const display = document.getElementById("visitorCount");
            const novoValor = prompt("Digite a senha admin", display.innerText);
            
            if (novoValor !== null && novoValor.trim() !== "") {
                display.innerText = novoValor;
                try {
                    await setDoc(visitasRef, { total: novoValor }, { merge: true });
                } catch (error) {
                    console.error("Erro ao salvar visitas:", error);
                    alert("Erro ao salvar no banco de dados.");
                }
            }
        } else {
            alert("Acesso negado! Faça login com o e-mail de administrador para acessar as visitas.");
        }
    };

    async function carregarHistorico() {
        const snap = await getDocs(query(collection(db, "historico_pedidos"), orderBy("data", "desc")));
        let html = "";
        
        snap.forEach(d => {
            const data = d.data();
            
            // O botão de marcar como verificado foi totalmente removido do painel visual. 
            // Agora o selo de verificado (✅) só aparece automaticamente quando o campo 'verificado' for alterado para true diretamente no Firebase.
            html += `<div class="item-historico">
                <b>${data.pagina}</b> | ${data.titulo} ${data.verificado ? '✅' : ''}<br>
                <small>Texto: ${data.texto}</small><br>
                <small>Links: ${data.trailer} | ${data.video}</small><br>
                <small>Min: ${data.minutos} | Ação: ${data.acao} (ID: ${data.idCom})</small>
            </div>`;
        });
        document.getElementById("listaPedidos").innerHTML = html || "Sem pedidos.";
    }

    async function carregarVisitas() {
        try {
            const snap = await getDoc(visitasRef);
            if (snap.exists()) {
                document.getElementById("visitorCount").innerText = snap.data().total;
            } else {
                document.getElementById("visitorCount").innerText = "0";
            }
        } catch (error) {
            console.error("Erro ao carregar visitas:", error);
            document.getElementById("visitorCount").innerText = "Erro";
        }
    }

    carregarHistorico();
    carregarVisitas();
</script>
</body>
</html>
